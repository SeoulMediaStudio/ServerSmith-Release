  <g transform="translate(28,28) scale(0.45312)">
    
    <rect x="0" y="0" width="256" height="256" rx="60" fill="url(#l_bg)"/>
    <!-- anvil -->
    <g>
      <!-- foot -->
      <rect x="84" y="178" width="88" height="20" rx="8" fill="url(#l_metal)"/>
